<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond sombre -->
  <rect width="32" height="32" rx="5" ry="5" fill="#0a0f0a"/>

  <!-- Bordure verte subtile -->
  <rect width="32" height="32" rx="5" ry="5" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.5"/>

  <!-- Prompt >_ en vert néon avec glow -->
  <text
    x="4"
    y="22"
    font-family="'Courier New', monospace"
    font-size="16"
    font-weight="bold"
    fill="#00ff41"
    filter="url(#glow)"
  >&gt;_</text>
</svg>
