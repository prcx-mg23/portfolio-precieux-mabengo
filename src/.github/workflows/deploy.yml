name: Deploy Portfolio

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Inject EmailJS config
        run: |
          cat > src/js/emailjs.config.js << 'EOF'
const EMAILJS_PUBLIC_KEY  = '${{ secrets.EMAILJS_PUBLIC_KEY }}';
const EMAILJS_SERVICE_ID  = '${{ secrets.EMAILJS_SERVICE_ID }}';
const EMAILJS_TEMPLATE_ID = '${{ secrets.EMAILJS_TEMPLATE_ID }}';

emailjs.init(EMAILJS_PUBLIC_KEY);

function sendEmail() {
  const status = document.getElementById('form-status');
  const params = {
    from_name: document.getElementById('from_name').value,
    reply_to:  document.getElementById('reply_to').value,
    subject:   document.getElementById('subject').value,
    message:   document.getElementById('message').value,
  };
  if (!params.from_name || !params.reply_to || !params.subject || !params.message) {
    status.textContent = '> Erreur : veuillez remplir tous les champs.';
    status.className = 'form-status error';
    return;
  }
  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params)
    .then(() => {
      status.textContent = '> Message envoyé avec succès.';
      status.className = 'form-status success';
      document.getElementById('from_name').value = '';
      document.getElementById('reply_to').value  = '';
      document.getElementById('subject').value   = '';
      document.getElementById('message').value   = '';
    })
    .catch((err) => {
      status.textContent = `> Erreur : ${err.text || 'Vérifiez vos clés.'}`;
      status.className = 'form-status error';
    });
}
EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .