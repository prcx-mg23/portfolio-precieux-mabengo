name: Deploy Portfolio

on:
  push:
    branches: [main]

# Permissions nécessaires pour déployer sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Inject EmailJS config
        env:
          PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
        run: |
          mkdir -p src/JavaScript
          python3 - << 'EOF'
          import os

          public_key  = os.environ["PUBLIC_KEY"]
          service_id  = os.environ["SERVICE_ID"]
          template_id = os.environ["TEMPLATE_ID"]

          content = f"""const EMAILJS_PUBLIC_KEY  = '{public_key}';
const EMAILJS_SERVICE_ID  = '{service_id}';
const EMAILJS_TEMPLATE_ID = '{template_id}';

emailjs.init(EMAILJS_PUBLIC_KEY);

function sendEmail() {{
  const status = document.getElementById('form-status');
  const params = {{
    from_name: document.getElementById('from_name').value,
    reply_to:  document.getElementById('reply_to').value,
    subject:   document.getElementById('subject').value,
    message:   document.getElementById('message').value,
  }};
  if (!params.from_name || !params.reply_to || !params.subject || !params.message) {{
    status.textContent = '> Erreur : veuillez remplir tous les champs.';
    status.className = 'form-status error';
    return;
  }}
  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params)
    .then(() => {{
      status.textContent = '> Message envoyé avec succès. Je vous répondrai rapidement.';
      status.className = 'form-status success';
      document.getElementById('from_name').value = '';
      document.getElementById('reply_to').value  = '';
      document.getElementById('subject').value   = '';
      document.getElementById('message').value   = '';
    }})
    .catch((err) => {{
      status.textContent = '> Erreur : ' + (err.text || 'Vérifiez vos clés.');
      status.className = 'form-status error';
    }});
}}
"""

          with open("src/JavaScript/emailjs.config.js", "w") as f:
              f.write(content)

          print("emailjs.config.js généré avec succès.")
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
