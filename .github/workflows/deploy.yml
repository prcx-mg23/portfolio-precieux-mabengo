name: Deploy Portfolio

on:
  push:
    branches: [main]

# Permissions nécessaires pour déployer sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v3

      - name: Inject EmailJS config
        env:
          PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
        run: |
          mkdir -p src/JavaScript
          {
            echo "const EMAILJS_PUBLIC_KEY  = '${PUBLIC_KEY}';"
            echo "const EMAILJS_SERVICE_ID  = '${SERVICE_ID}';"
            echo "const EMAILJS_TEMPLATE_ID = '${TEMPLATE_ID}';"
            echo ""
            echo "emailjs.init(EMAILJS_PUBLIC_KEY);"
            echo ""
            echo "function sendEmail() {"
            echo "  const status = document.getElementById('form-status');"
            echo "  const params = {"
            echo "    from_name: document.getElementById('from_name').value,"
            echo "    reply_to:  document.getElementById('reply_to').value,"
            echo "    subject:   document.getElementById('subject').value,"
            echo "    message:   document.getElementById('message').value,"
            echo "  };"
            echo "  if (!params.from_name || !params.reply_to || !params.subject || !params.message) {"
            echo "    status.textContent = '> Erreur : veuillez remplir tous les champs.';"
            echo "    status.className = 'form-status error';"
            echo "    return;"
            echo "  }"
            echo "  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params)"
            echo "    .then(() => {"
            echo "      status.textContent = '> Message envoyé avec succès.';"
            echo "      status.className = 'form-status success';"
            echo "      document.getElementById('from_name').value = '';"
            echo "      document.getElementById('reply_to').value  = '';"
            echo "      document.getElementById('subject').value   = '';"
            echo "      document.getElementById('message').value   = '';"
            echo "    })"
            echo "    .catch((err) => {"
            echo "      status.textContent = \"> Erreur : \${err.text || 'Vérifiez vos clés.'}\";"
            echo "      status.className = 'form-status error';"
            echo "    });"
            echo "}"
          } > src/JavaScript/emailjs.config.js

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
